[package]
name = "bs-edge-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
fd-lock = "4.0.4"
flate2 = "1.1.9"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tar = "0.4.46"
ureq = { version = "2.9", features = ["json"] } # Minimal blocking HTTP client, no Tokio required
jsonwebtoken = "9.3.0"
chrono = "0.4.38"
base64 = "0.22.1"
urlencoding = "2.1.3"
chacha20poly1305 = "0.10.1"
rand = "0.10.1"
[features]
default = []
dangerous_execution = []

[[bin]]
name = "bs-watchdog"
path = "src/watchdog.rs"

[profile.release]
opt-level = "z" # Optimize for size
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
walkdir = "2.5.0"
