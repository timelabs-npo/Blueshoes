[package]
name = "bs-flow-observation"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading"] }

[dev-dependencies]
sha2 = "0.10"

[lints.rust]
unsafe_code = "deny"
