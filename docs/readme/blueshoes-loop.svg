<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Blueshoes adaptive routing loop</title>
  <desc id="desc">Animated diagram showing observation, local truth validation, route mutation, validation and rollback inside a RAM-only OpenBSD core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070d"/><stop offset="1" stop-color="#0b1223"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#13d7ff"/><stop offset=".5" stop-color="#2477ff"/><stop offset="1" stop-color="#7857ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .label{font:700 24px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f4f7ff}.sub{font:500 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#9ca9c6}.box{fill:#0d1424;stroke:#31415f;stroke-width:2}.wire{fill:none;stroke:url(#blue);stroke-width:5;stroke-linecap:round;stroke-dasharray:14 14;animation:dash 2.4s linear infinite}.pulse{fill:#2ee9ff;filter:url(#glow);animation:pulse 1.6s ease-in-out infinite}.tiny{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#7f8ba8}@keyframes dash{to{stroke-dashoffset:-56}}@keyframes pulse{50%{opacity:.3;r:5}}
      @media (prefers-reduced-motion:reduce){.wire,.pulse{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <text x="62" y="74" class="label" font-size="34">THE ROUTER THAT REFUSES TO TRUST ITSELF.</text>
  <text x="62" y="108" class="sub">observe → reason locally → mutate minimally → verify → heal or roll back</text>

  <path class="wire" d="M160 256H1040"/>
  <circle class="pulse" cx="160" cy="256" r="10"><animate attributeName="cx" values="160;1040;160" dur="6s" repeatCount="indefinite"/></circle>

  <g transform="translate(58 176)"><rect class="box" width="188" height="156" rx="24"/><text x="24" y="52" class="label">OBSERVE</text><text x="24" y="84" class="sub">links · DNS · DPI</text><text x="24" y="111" class="sub">latency · routes</text><text x="24" y="138" class="tiny">read-only first</text></g>
  <g transform="translate(292 156)"><rect class="box" width="220" height="196" rx="28" stroke="#2ee9ff"/><text x="24" y="54" class="label">RHEKNEL</text><text x="24" y="88" class="sub">local truth</text><text x="24" y="116" class="sub">validator</text><text x="24" y="148" class="tiny">authority stays local</text><text x="24" y="172" class="tiny">claims need receipts</text></g>
  <g transform="translate(558 176)"><rect class="box" width="188" height="156" rx="24"/><text x="24" y="52" class="label">EVOLVE</text><text x="24" y="84" class="sub">profile synthesis</text><text x="24" y="111" class="sub">bounded mutation</text><text x="24" y="138" class="tiny">AI proposes</text></g>
  <g transform="translate(792 176)"><rect class="box" width="188" height="156" rx="24"/><text x="24" y="52" class="label">VERIFY</text><text x="24" y="84" class="sub">connectivity</text><text x="24" y="111" class="sub">invariants</text><text x="24" y="138" class="tiny">machine evidence</text></g>
  <g transform="translate(1026 176)"><rect class="box" width="116" height="156" rx="24" stroke="#6bffb1"/><text x="18" y="52" class="label" font-size="20">HEAL</text><text x="18" y="84" class="sub" font-size="13">keep</text><text x="18" y="108" class="sub" font-size="13">or undo</text><text x="18" y="138" class="tiny">rollback</text></g>

  <path d="M1084 358 C1084 445 680 456 680 378" fill="none" stroke="#6bffb1" stroke-width="3" stroke-dasharray="8 10"/>
  <text x="776" y="446" class="tiny">failure is a branch, not a brick</text>
  <text x="60" y="488" class="tiny">TARGET CONSTITUTION: OpenBSD · RAM-only root · no remote sovereign control plane</text>
</svg>