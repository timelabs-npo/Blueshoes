<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Blueshoes and the VPN graveyard</title><desc id="desc">A playful illustration of a blue shoe stepping past generic VPN subscription tombstones toward an open network horizon.</desc>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#090d18"/><stop offset="1" stop-color="#11182a"/></linearGradient><linearGradient id="shoe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25ddff"/><stop offset=".55" stop-color="#287cff"/><stop offset="1" stop-color="#704bff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="8"/></filter><style>.t{font:800 32px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f7f9ff}.s{font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#9da9c3}.grave{fill:#171f31;stroke:#44506b;stroke-width:2}.dash{stroke:#39dfff;stroke-width:4;stroke-dasharray:10 12;animation:m 1.8s linear infinite}@keyframes m{to{stroke-dashoffset:-44}}@media(prefers-reduced-motion:reduce){.dash{animation:none}}</style></defs>
<rect width="1200" height="460" rx="34" fill="url(#sky)"/><circle cx="1030" cy="105" r="74" fill="#37e2ff" opacity=".13" filter="url(#g)"/>
<text x="58" y="68" class="t">VPNs become a fallback. Not your religion.</text><text x="58" y="101" class="s">No rented identity. No mandatory tunnel monoculture. No remote control plane by default.</text>
<g transform="translate(86 190)"><path class="grave" d="M0 190V72Q0 0 70 0t70 72v118z"/><text x="70" y="75" class="s" text-anchor="middle">monthly</text><text x="70" y="102" class="s" text-anchor="middle">tunnel</text><text x="70" y="147" class="s" text-anchor="middle">RIP</text></g>
<g transform="translate(256 210)"><path class="grave" d="M0 170V66Q0 0 62 0t62 66v104z"/><text x="62" y="72" class="s" text-anchor="middle">one</text><text x="62" y="98" class="s" text-anchor="middle">exit</text><text x="62" y="138" class="s" text-anchor="middle">RIP</text></g>
<g transform="translate(408 182)"><path class="grave" d="M0 198V78Q0 0 74 0t74 78v120z"/><text x="74" y="82" class="s" text-anchor="middle">trust</text><text x="74" y="108" class="s" text-anchor="middle">provider</text><text x="74" y="153" class="s" text-anchor="middle">RIP</text></g>
<path class="dash" d="M570 330 C690 300 780 245 910 220 C1005 201 1065 185 1142 150" fill="none"/>
<g transform="translate(642 196) rotate(-10)"><path d="M0 100C28 44 76 0 150 8c35 4 67 35 116 38 39 3 71-7 107 15 21 13 32 31 33 53 1 35-24 63-63 68-79 9-127-17-190-20-62-3-99 14-134-5-27-15-34-35-19-57z" fill="url(#shoe)" stroke="#7feeff" stroke-width="4"/><path d="M82 82c44 8 93 12 149 12" fill="none" stroke="#e9f9ff" stroke-width="8" stroke-linecap="round"/><path d="M94 104c48 6 94 7 141 7" fill="none" stroke="#09111e" stroke-width="6" stroke-linecap="round"/><path d="M340 134c50 9 75 3 88-8" fill="none" stroke="#f0f6ff" stroke-width="16" stroke-linecap="round"/></g>
<text x="782" y="396" class="t" font-size="27">THE INTERNET IS FREE. AGAIN.</text><text x="783" y="426" class="s">Use a tunnel when it helps. Stop needing one when it doesn’t.</text>
</svg>