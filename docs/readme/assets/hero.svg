<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
<title id="title">Blueshoes — Flows survive, paths mutate</title>
<desc id="desc">Bright editorial hero for Blueshoes. Electric blue shoes step through a colorful time-varying network graph. Flow paths braid around a cut and reconnect. Text highlights FLOWS and FLOW SURGERY TOOLKIT. F1 and X appear only as explicitly fake sponsor parody text. blueshoes.space is marked pre-launch.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fffced"/><stop offset=".48" stop-color="#effff8"/><stop offset="1" stop-color="#e7f2ff"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#d7ff31" stop-opacity=".85"/><stop offset="1" stop-color="#d7ff31" stop-opacity="0"/></radialGradient>
  <radialGradient id="pinkAura"><stop stop-color="#ff4fb2" stop-opacity=".33"/><stop offset="1" stop-color="#ff4fb2" stop-opacity="0"/></radialGradient>
  <linearGradient id="shoe" x2=".25" y2="1"><stop stop-color="#7fdcff"/><stop offset=".3" stop-color="#297dff"/><stop offset=".72" stop-color="#1745dc"/><stop offset="1" stop-color="#071f75"/></linearGradient>
  <linearGradient id="sole" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#c7eaff"/><stop offset="1" stop-color="#7897c6"/></linearGradient>
  <linearGradient id="flowA" x2="1"><stop stop-color="#16d7ff"/><stop offset="1" stop-color="#006dff"/></linearGradient>
  <linearGradient id="flowB" x2="1"><stop stop-color="#ff4fb2"/><stop offset="1" stop-color="#ff8a32"/></linearGradient>
  <linearGradient id="flowC" x2="1"><stop stop-color="#d7ff31"/><stop offset="1" stop-color="#65ff9c"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#071735" stroke-opacity=".055"/></pattern>
  <g id="shoeShape">
    <path d="M0 58C20 56 33 40 35 11L58 3 91 34 150 48C175 54 186 67 181 82L158 95 38 88 7 76Z" fill="url(#shoe)" stroke="#0c45ba" stroke-width="2"/>
    <path d="M2 69C38 78 69 73 103 83S151 91 181 78L184 91C172 111 128 113 99 104L10 92Z" fill="url(#sole)" stroke="#6a92c7"/>
    <path d="M40 16L60 36 87 39 76 49 50 45Z" fill="#0b246e"/>
    <path d="M49 20L69 41M58 18L80 42M69 29L88 49M81 39L105 55" stroke="#d9f9ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M55 51Q74 67 103 68Q81 77 61 70Z" fill="#a8fff0"/>
  </g>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.dash{stroke-dasharray:16 19;animation:dash 7s linear infinite}.float{animation:float 6s ease-in-out infinite}.float2{animation:float 6s -3s ease-in-out infinite}.pulse{animation:pulse 3.4s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-350}}@keyframes float{50%{transform:translateY(-10px)}}@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.dash,.float,.float2,.pulse{animation:none}}
</style>
<rect width="1280" height="660" rx="28" fill="url(#bg)"/>
<rect width="1280" height="660" rx="28" fill="url(#grid)"/>
<circle cx="1080" cy="135" r="250" fill="url(#sun)" filter="url(#blur)"/>
<circle cx="895" cy="505" r="260" fill="url(#pinkAura)" filter="url(#blur)"/>

<!-- top rail -->
<text x="48" y="58" fill="#071735" font-size="28" font-weight="900" letter-spacing="-1.3">blueshoes<tspan fill="#0876ff">_</tspan></text>
<text x="48" y="86" fill="#0876ff" font-size="11" font-weight="900" letter-spacing="2.3">POST-OPENWRT · POST-VPN · POST-DPI · POST-QUANTUM</text>
<g transform="translate(925 34)">
 <rect width="136" height="36" rx="18" fill="#ff4fb2"/><text x="68" y="23" text-anchor="middle" fill="#071735" font-size="11" font-weight="900">FAKE SPONSOR // F1*</text>
 <rect x="146" width="122" height="36" rx="18" fill="#d7ff31"/><text x="207" y="23" text-anchor="middle" fill="#071735" font-size="11" font-weight="900">FAKE SPONSOR // X*</text>
</g>
<path d="M48 108H1232" stroke="#071735" stroke-opacity=".16"/>

<!-- main copy -->
<text x="48" y="188" fill="#071735" font-size="56" font-weight="900" letter-spacing="-3.1">THE INTERNET</text>
<text x="48" y="250" fill="#071735" font-size="56" font-weight="900" letter-spacing="-3.1">IS FREE.</text>
<text x="45" y="365" fill="#0876ff" font-family="Georgia,serif" font-size="118" font-style="italic" letter-spacing="-7">Again!</text>
<text x="50" y="421" fill="#071735" font-size="24" font-weight="900">FLOWS SURVIVE. PATHS MUTATE.</text>
<text x="50" y="456" fill="#ff277f" font-size="20" font-weight="900" letter-spacing="1.2">FLOW SURGERY TOOLKIT</text>
<text x="50" y="486" fill="#53617c" font-size="16">CUT · BYPASS · SPLICE · BRAID · GRAFT · SEAL · ROLLBACK</text>
<g transform="translate(50 520)">
 <rect width="330" height="62" rx="18" fill="#071735"/>
 <text x="18" y="26" fill="#d7ff31" class="mono" font-size="15">Bf = b</text>
 <text x="110" y="26" fill="#fff" class="mono" font-size="15">//</text>
 <text x="142" y="26" fill="#83ecff" class="mono" font-size="15">BΔf = 0</text>
 <text x="18" y="48" fill="#aebbd0" font-size="11">preserve the boundary; mutate admissible support</text>
</g>

<!-- graph / braid -->
<g fill="none" stroke-linecap="round">
 <path d="M620 238C704 145 782 167 838 230S972 322 1090 210S1190 190 1240 244" stroke="#0876ff" stroke-width="18" opacity=".13"/>
 <path d="M620 238C704 145 782 167 838 230S972 322 1090 210S1190 190 1240 244" stroke="url(#flowA)" stroke-width="6"/>
 <path class="dash" d="M620 238C704 145 782 167 838 230S972 322 1090 210S1190 190 1240 244" stroke="#fff" stroke-width="2.5"/>
 <path d="M620 331C707 391 762 441 842 386S950 305 1040 367S1175 405 1240 332" stroke="url(#flowB)" stroke-width="6"/>
 <path class="dash" d="M620 331C707 391 762 441 842 386S950 305 1040 367S1175 405 1240 332" stroke="#fff" stroke-width="2"/>
 <path d="M620 413C712 473 781 526 880 493S1040 448 1240 476" stroke="url(#flowC)" stroke-width="5"/>
</g>
<g fill="#fffdf1" stroke="#071735" stroke-width="3"><circle cx="620" cy="238" r="15"/><circle cx="838" cy="230" r="13"/><circle cx="1090" cy="210" r="13"/><circle cx="1240" cy="244" r="15"/><circle cx="620" cy="331" r="15"/><circle cx="842" cy="386" r="13"/><circle cx="1040" cy="367" r="13"/><circle cx="1240" cy="332" r="15"/><circle cx="620" cy="413" r="15"/><circle cx="880" cy="493" r="13"/><circle cx="1240" cy="476" r="15"/></g>
<!-- cut -->
<circle cx="972" cy="322" r="44" fill="#ff4f9a" opacity=".14" class="pulse"/>
<path d="M945 295L999 349M999 295L945 349" stroke="#ff355f" stroke-width="9" stroke-linecap="round"/>
<text x="972" y="282" text-anchor="middle" fill="#d6244f" font-size="11" font-weight="900" letter-spacing="1.2">CUT / FAILURE</text>
<!-- shoes riding braid -->
<g class="float"><g transform="translate(783 270) rotate(-10) scale(1.05)"><use href="#shoeShape"/></g></g>
<g class="float2"><g transform="translate(1018 430) rotate(12) scale(.85)"><use href="#shoeShape"/></g></g>
<!-- labels -->
<g font-size="11" font-weight="900" letter-spacing="1.4"><text x="662" y="158" fill="#0876ff">BYPASS</text><text x="792" y="445" fill="#ff277f">BRAID</text><text x="1090" y="518" fill="#448900">SPLICE / GRAFT</text></g>

<path d="M48 606H1232" stroke="#071735" stroke-opacity=".16"/>
<text x="48" y="637" fill="#071735" font-size="12" font-weight="900" letter-spacing="1.7">blueshoes.space / SPACEPORT PRE-LAUNCH</text>
<text x="1232" y="637" text-anchor="end" fill="#53617c" font-size="10">* parody text only · no affiliation / endorsement</text>
</svg>