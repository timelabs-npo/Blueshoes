name: Read-only Flow Observation
on:
  pull_request:
  push:
    branches: [evolution/clashmac-flow-observation-v1]
permissions:
  contents: read
jobs:
  observation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --manifest-path runtime/flow-observation/Cargo.toml --check
      - name: Portable semantics and Windows query unit tests
        run: cargo test --manifest-path runtime/flow-observation/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path runtime/flow-observation/Cargo.toml --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo build --manifest-path runtime/flow-observation/Cargo.toml --release --locked
      - name: Dependency, reviewed source, corpus and CLI authority boundary
        run: python runtime/flow-observation/tools/verify_boundary.py
      - name: Windows native smoke (aggregate only)
        if: runner.os == 'Windows'
        run: runtime/flow-observation/target/release/bs-flow-observation.exe smoke
      - name: Windows native wire/graph schema verification
        if: runner.os == 'Windows'
        run: |
          python -m pip install jsonschema==4.26.0 rfc3339-validator==0.1.4
          python runtime/flow-observation/tools/verify_snapshot.py
