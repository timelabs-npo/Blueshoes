name: Cloudflare preview claim

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wrangler.preview.jsonc'
      - '.github/workflows/cloudflare-preview-claim.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy tokenless preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --temporary --config wrangler.preview.jsonc 2>&1 | tee /tmp/wrangler-preview.log
          echo '--- preview receipt ---'
          grep -E 'Claim URL:|https://.*workers.dev' /tmp/wrangler-preview.log || true
